# 개발 포트는 8080, 프론트는 5173 이다. IntelliJ 실행 버튼이 기본으로 쓰는 값이라 옮기지
# 않는다. 겹치면 안 되는 건 부하 측정 환경 쪽이라 그쪽만 18xxx 대역으로 떨어뜨렸다
# (perf/README.md 의 "포트" 절).
#
# base(application.yaml)가 아니라 여기 두는 이유는 운영 컨테이너 때문이다 — deploy 의
# compose 가 8080:8080 으로 매핑하고 있어서, base 를 바꾸면 운영이 조용히 깨진다.
server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    # 자주 발생하는 정상 동작(SSE 연결·종료, 마감 건너뜀 등)은 debug로 남긴다.
    # prod는 info라 조용하고, 개발 중에는 여기서 그 흐름을 그대로 본다.
    com.hot6ix.upbid: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
