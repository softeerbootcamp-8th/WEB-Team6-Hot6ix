spring:
  application:
    name: upbid
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:upbid}?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 10은 HikariCP 기본값이라 지금 동작과 같다. 밖으로 뺀 이유는 부하 측정에서 이 값 하나만
      # 바꿔 재야 하는데, 고정돼 있으면 대조 실험을 하려고 재배포를 해야 하기 때문이다.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  # 실제로 이 연결을 쓰는 것 — ShedLock 분산 락(#286)과 물품 마감 예약(#289).
  # 마감 예약은 Redis 에만 있어서, 이 연결이 죽으면 마감 시각이 지난 물품이 안 닫힌다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 기본값(60s)이면 연결 하나가 응답 없이 멈춰도 커맨드마다 60초씩 물고 있는다 (#299).
      timeout: ${REDIS_COMMAND_TIMEOUT:5000}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
        # 운영 Redis(자체 호스팅 EC2)가 자체 서명 인증서를 쓰기 때문에 JVM 기본 트러스트스토어가
        # 신뢰하지 않는다. ssl.enabled=false인 local·perf에서는 무시된다.
        bundle: redis

  # 운영 Redis의 자체 서명 CA. 개인키는 Redis 서버에만 있고 여기 담긴 건 공개 인증서뿐이다.
  ssl:
    bundle:
      pem:
        redis:
          truststore:
            certificate: classpath:redis-ca.crt

  # 로그인 세션 저장소. spring-boot-starter-session-data-redis가 위 data.redis 커넥션을
  # 그대로 재사용한다 — 이 밑에 새 Lettuce/커넥션 설정을 추가하지 않는다(#294/#299).
  #
  # repository-type은 기본값(default, 비색인)을 그대로 쓴다 — 세션 조회가 세션 ID
  # 기준뿐이라 principal별 색인이 필요 없다.
  session:
    # 클래스패스에 다른 세션 저장소 구현(JDBC, Hazelcast 등)이 없으면 자동 감지되긴 하지만,
    # 나중에 그런 의존성이 늘어나도 조용히 바뀌지 않도록 명시한다.
    store-type: redis
    timeout: ${SESSION_TIMEOUT:1h}
    data:
      redis:
        # 기본값(on-save)이면 필터가 요청 끝에 한꺼번에 저장해서, Redis 쓰기 실패가
        # 컨트롤러·트랜잭션이 다 끝난 뒤 필터 finally에서 터진다 — 이 시점은
        # GlobalExceptionHandler가 못 잡고, 응답이 이미 나갔을 수도 있다.
        # setAttribute() 호출 즉시 쓰게 해서, 실패가 비즈니스 로직 안에서 평범한
        # 예외로 터지고 응답 전송 전에 GlobalExceptionHandler의 공용 500 처리로
        # 드러나게 한다. login()/signup() 모두 이 실패로 되돌려야 할 DB effect가
        # 없어서(유저 생성은 unique 제약 덕에 재로그인으로 자연 복구됨) @Transactional로
        # 트랜잭션을 묶지는 않는다(#302).
        flush-mode: immediate

  # 기본값 1이면 마감 한 건이 입찰의 행 락을 기다리는 동안 다른 물품 마감과 SMS 정리 cron이
  # 함께 밀린다. 값의 근거와 전용 스케줄러 분리 여부는 3주차에 측정하고 정한다.
  task:
    # 마감 실행용 Executor 빈을 따로 등록하면서 넣었다. Boot 는 Executor 빈이 하나라도 있으면
    # applicationTaskExecutor 를 안 만드는데(OnExecutorCondition), 그게 없어지면 Spring MVC 의
    # 비동기 처리가 스레드를 매번 새로 만드는 기본값으로 떨어진다. SSE 연결이 그 경로를 타므로
    # force 로 기본 실행자를 그대로 두게 한다.
    execution:
      mode: force
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}

  jpa:
    hibernate:
      # 스키마는 Hibernate가 아니라 Flyway가 만든다 (#96). 엔티티를 바꾸면
      # src/main/resources/db/migration에 V{다음번호}__{설명}.sql을 직접 추가해야 한다.
      #
      # 테스트도 이 값을 쓴다. src/test/resources에 yaml이 없어서 Testcontainers 테스트가
      # 이 파일을 읽기 때문에, 마이그레이션이 엔티티와 어긋나면 CI가 잡는다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

logging:
  pattern:
    correlation: "%correlationId{traceId(8)}"
  # 둘 다 Boot 기본값인 INFO 라 지금 동작과 같다. 측정 창구에만 warn 으로 내린다.
  # DomainEventSseListener 가 입찰 1건마다 한 줄을 응답 경로 안에서 쓰기 때문에, 로그를
  # 안 내리면 재는 대상에 로그 출력이 섞인다 (perf 프로파일이 같은 이유로 warn 이다).
  level:
    root: ${LOG_LEVEL:info}
    com.hot6ix.upbid: ${APP_LOG_LEVEL:info}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

# 값 자체는 지금까지 코드에 상수로 박혀 있던 것과 같다. 밖으로 뺀 이유는 부하 측정에서
# 이 셋이 대조 실험의 변수이기 때문이다 — 값 하나만 바꿔 재려면 재빌드 없이 바꿀 수 있어야 한다.
upbid:
  # 비어 있으면 local·perf 에서만 dev-login 이 열리고, 그때는 헤더도 안 본다 (지금 동작).
  # 배포에서 값을 주면 그동안만 엔드포인트가 생기고 헤더가 맞는 요청만 세션을 받는다 (#266).
  dev-login:
    token: ${DEV_LOGIN_TOKEN:}
  rate-limit:
    redis:
      # 기본 연결(spring.data.redis.timeout, 5s)보다 훨씬 짧게 잡는다. Redis 가 응답 없이
      # 멈췄을 때 입찰 요청이 이 값만큼만 붙들렸다가 fail-open 으로 통과해야 하기 때문이다.
      command-timeout: ${RATE_LIMIT_REDIS_TIMEOUT:200ms}
    bid:
      # 확정값이 아니라 제안값이다. 실사용 로그의 사용자별 req/s 분포로 재조정한다.
      # 유효 입찰은 최고가를 1건씩 갱신하므로 사람 손으로 낼 수 있는 것은 초당 1~2건이
      # 상한이고, capacity 는 소프트클로즈 구간 연타를 흡수하는 여유분이다.
      enabled: ${BID_RATE_LIMIT_ENABLED:true}
      capacity: ${BID_RATE_LIMIT_CAPACITY:5}
      refill-per-second: ${BID_RATE_LIMIT_REFILL_PER_SECOND:2}
  sse:
    heartbeat-interval-ms: ${SSE_HEARTBEAT_MS:30000}
    emitter-timeout-ms: ${SSE_TIMEOUT_MS:3600000}
    buffer-size: ${SSE_BUFFER_SIZE:50}
  bid-stream:
    key: auction:bid:stream
    group: bid-mysql-writers
    # 컨테이너마다 HOSTNAME이 달라 재시작 전 Consumer의 pending도 구별된다. 처리기는 그룹
    # 전체 PEL에서 먼저 claim하므로 이름이 바뀌어도 이벤트가 고립되지 않는다.
    consumer: ${HOSTNAME:local}-bid-writer
    poll-delay: ${BID_STREAM_POLL_DELAY:100ms}
    block-timeout: ${BID_STREAM_BLOCK_TIMEOUT:50ms}
    # Stream 단건 DB 트랜잭션의 최대 처리시간보다 길어야 한다. 운영 실측 뒤 조정한다.
    lock-at-most-for: ${BID_STREAM_LOCK_AT_MOST_FOR:5s}
  auction:
    max-in-progress-per-room: ${MAX_IN_PROGRESS_PER_ROOM:3}
    close:
      # 마감 예약을 Redis 에서 꺼내 실행하는 값들. 배포에서 재보고 조정할 값이라 env 로 뺀다.
      #
      # poll-interval-ms 는 마감 지연의 바닥이 된다. 예정 시각과 실행 사이에 이 주기가 통째로
      # 깔리기 때문이다. 배포 실측 마감 지연이 입찰이 겹칠 때 127~358ms, 안 겹칠 때 1ms 라
      # (8/12) 500ms 를 얹으면 지연이 몇 배가 된다. 훑는 비용 자체는 서버 3대 기준 초당 30회라
      # 무시할 수준이므로 짧게 잡고, 배포에서 close.delay 를 보며 더 내릴지 정한다.
      poll-interval-ms: ${CLOSE_POLL_INTERVAL_MS:100}
      # Redis 는 스크립트가 도는 동안 다른 명령을 못 받는다. 한 번에 너무 많이 집으면 그만큼
      # Redis 가 멈추므로 상한을 둔다. 50 은 아직 재보고 정한 값이 아니다.
      claim-batch-size: ${CLOSE_CLAIM_BATCH_SIZE:50}
      # 일꾼을 기다리는 마감이 몇 건까지 쌓일지. 집는 개수가 여기 남은 자리에 맞춰지므로,
      # 마감이 몰렸을 때 한 번에 얼마나 받아낼지가 이 값으로 정해진다.
      queue-capacity: ${CLOSE_QUEUE_CAPACITY:50}
      # 마감 한 건이 배포에서 389~492ms 였다. 처리 중에 예약이 다시 떠오르면 다른 서버가 같은
      # 물품에 달라붙으므로 그보다 충분히 크게 잡는다.
      visibility-timeout: ${CLOSE_VISIBILITY_TIMEOUT:30s}
      # 지금 spring.task.scheduling.pool 과 같은 수다. 배포에서 스케줄러 일꾼이 최대 1개만
      # 돌아서(8/12) 늘릴 이유가 없고, 이번 변경으로 스레드 조건이 달라지지 않게 맞춘다.
      worker-pool-size: ${CLOSE_WORKER_POOL_SIZE:4}
      # 예약이 Redis 에만 있어서, Redis 가 비면 진행중 물품이 영영 안 닫힌다. 그때 DB 를 보고
      # 다시 채우는 안전망이다. 이 한 번의 조회로 마감 예약과 알림 예약을 함께 채운다 (#290).
      #
      # 이 값이 곧 마감이 늦어질 수 있는 최악이다. 예약이 유실되거나 낡은 시각으로 남으면
      # 다음 재동기화까지 그대로 있기 때문이다 (#327). 60s 는 "Redis 가 통째로 비었을 때
      # 채운다"는 원래 용도만 보고 잡은 값이라, 마감 시각을 지키는 쪽으로 당긴다. 조회가
      # auction_items 전체 스캔이라(status 인덱스 없음) 표가 커지면 다시 볼 값이다.
      resync-interval-ms: ${CLOSE_RESYNC_INTERVAL_MS:10000}
    closing-soon:
      # 마감 임박 알림 예약을 Redis 에서 꺼내 실행하는 값들. 마감과 따로 두는 것은 알림 한
      # 건이 훨씬 가볍기 때문이고, 한쪽만 조여 볼 수 있게 하려는 것이다 (#290).
      #
      # 알림은 마감처럼 초 단위로 맞아야 하는 일이 아니다. 몇백 ms 늦게 나가도 사용자가
      # 알아채지 못하므로, 마감보다 느슨하게 잡아 Redis 를 훑는 횟수를 줄인다.
      poll-interval-ms: ${CLOSING_SOON_POLL_INTERVAL_MS:500}
      claim-batch-size: ${CLOSING_SOON_CLAIM_BATCH_SIZE:50}
      # 마감(30s)보다 짧다. 알림은 미뤄 둔 시각에 다시 떠올라도 notified_at 이 중복을 막아
      # 주므로, 길게 잡아 얻는 것이 없고 죽은 서버가 쥔 알림만 늦어진다.
      visibility-timeout: ${CLOSING_SOON_VISIBILITY_TIMEOUT:10s}
    room:
      # 물품이 다 마감됐는데 판매자가 종료를 안 누른 방을 서버가 대신 닫는다(#284).
      #
      # 12시간은 "방송을 마치고 종료를 안 눌렀다"와 "잠깐 자리를 비웠다"를 가르는 값이다.
      # 짧게 잡으면 판매자가 쉬었다 이어서 물품을 올리려던 방까지 닫힌다.
      idle-close-after: ${ROOM_IDLE_CLOSE_AFTER:12h}
      # 12시간을 재는 일이라 주기가 늦어도 손해가 없다. 대신 이 주기마다 방 전체를 훑는
      # 조회가 한 번 돌므로 짧게 잡지 않는다.
      idle-close-interval-ms: ${ROOM_IDLE_CLOSE_INTERVAL_MS:600000}
      # 한 tick 에 닫을 방 수 상한. 잘린 방은 다음 주기에 다시 집힌다.
      idle-close-batch-size: ${ROOM_IDLE_CLOSE_BATCH_SIZE:50}
    result-cache:
      # 종료된 경매방 결과 조회의 공개 부분만 담는다(#329). CLOSED 방만 저장하므로 히트 =
      # 되돌아갈 수 없는 상태다. 남는 변동은 상품 이름·이미지 수정(ProductService.update가
      # 이미 소급 반영을 수용한 트레이드오프)과 닉네임·상점명 변경뿐이라 TTL로 경계를 짓는다.
      enabled: ${RESULT_CACHE_ENABLED:true}
      ttl: ${RESULT_CACHE_TTL:60s}
  deal:
    award-recovery:
      enabled: ${AWARD_RECOVERY_ENABLED:true}
      interval-ms: ${AWARD_RECOVERY_INTERVAL_MS:300000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  onboarding-session-timeout: ${ONBOARDING_SESSION_TIMEOUT:10m}
  cache:
    # 방이 바뀌는 지점마다 캐시를 직접 지우므로, 이 값은 그중 하나를 빠뜨렸을 때를 위한 안전망이다.
    time-to-live: ${CACHE_TTL:5m}
  alert:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      cooldown-seconds: ${SLACK_ALERT_COOLDOWN_SECONDS:60}

ncp:
  sms:
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
    service-id: ${NCP_SERVICE_ID}
    send-from: ${NCP_SENDER_PHONE}
    connect-timeout: 5s
    read-timeout: 10s

# 이미지 업로드용 S3.
#
# 액세스 키·시크릿은 여기에도 환경변수에도 두지 않는다. app EC2에 붙인 인스턴스 역할
# upbid-ec2-role을 DefaultCredentialsProvider가 찾아 쓴다. 로컬은 aws configure로
# 만든 ~/.aws/credentials를 같은 provider가 찾는다. 그래서 설정이 환경마다 갈리지 않는다.
#
# public-base-url을 bucket·region에서 조립하지 않고 따로 적는다. 나중에 CloudFront를
# 앞에 두면 읽는 주소만 그 도메인으로 바뀌고 버킷 이름은 그대로이기 때문이다.
aws:
  region: ap-northeast-2
  s3:
    bucket: upbid-bucket
    public-base-url: https://upbid-bucket.s3.ap-northeast-2.amazonaws.com
