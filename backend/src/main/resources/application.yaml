spring:
  application:
    name: upbid
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:upbid}?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 마감 90건이 한꺼번에 닫히는 부하로 1·2·4·6·8·10·12·16 을 재서 정한 값이다(이슈 #198).
  #
  #   스레드   마감 지연   실패   5xx   입찰 접수
  #      4     5,630ms     0      0     30,756
  #      8     2,326ms     0      0     30,950
  #     10     2,183ms     0      0     29,938
  #     12       터짐      4     60     17,284
  #
  # 12 부터 무너지는 이유는 커넥션 풀이 10 이기 때문이다. 마감 뒤 낙찰 후보 생성이
  # REQUIRES_NEW 라 한 건이 커넥션을 통째로 쥐는데, 스레드가 커넥션보다 많으면 못 얻은
  # 마감이 죽고 그 여파로 사용자 입찰까지 5xx 가 난다. 상한을 정하는 것은 CPU 가 아니라
  # 커넥션 풀이다.
  #
  # 커넥션을 20 으로 올려 다시 재보니 스레드 12 와 16 에서도 안 터졌다. 상한을 정하는 것이
  # 커넥션 풀이라는 것은 이걸로 확인됐다. 커넥션 풀을 늘리면 이 값도 같이 올려야 한다.
  #
  # 10 이 아니라 8 로 둔 것은 속도 때문이 아니다. 같은 조건을 여러 번 재면 값이 1.5 배까지
  # 흔들려서 8 과 10 의 차이(6%)는 그 안에 묻힌다. 10 은 스케줄러가 커넥션을 다 가져갈 수
  # 있는 값이라 여유가 없고 12 에서 바로 터지므로, 두 칸 남기는 8 로 둔다.
  #
  # 전용 스케줄러 분리 여부는 아직 못 정했다. heartbeat 를 전용 풀로 떼서 A/B 를
  # 돌려 봤지만 각 2회씩이라 두 쪽 범위가 겹쳤고, 같은 조건인데 기준선이 2배 튀어서
  # 무엇을 비교한 것인지 말할 수 없는 상태다. 근거를 못 만들었으므로 지금은 안 뗀다.
  #
  # 지금까지 나온 것만 적어 둔다. heartbeat 가 굶어서 SSE 연결이 끊긴다는 걱정은 16회
  # 측정에서 한 번도 재현되지 않았고(전부 기대한 횟수만큼 다 돌았다), 30초에 한 번
  # 한 바퀴가 최대 0.5초라 스레드 하나 시간의 1.7% 다. 다만 한 바퀴는 접속 수에 비례해
  # 늘어나므로(접속 0에서 1ms, 800에서 43~506ms) 접속이 수천 단위로 가면 다시 봐야 한다.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:8}

  jpa:
    hibernate:
      # 엔티티와 실제 스키마가 벌어져서 한 번 싹 맞추려고 create로 둔다.
      # update는 컬럼 삭제·타입 변경을 반영하지 않아 어긋난 채로 쌓인다.
      #
      # 주의: 한 번만 도는 게 아니라 **앱이 뜰 때마다** 테이블을 지우고 다시 만든다.
      # 재배포는 물론 EC2 재부팅이나 컨테이너 재시작(restart: unless-stopped)에도
      # 데이터가 사라진다. Flyway를 붙이면서 validate로 바꾼다.
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:2h}
      cookie:
        name: SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

# 값 자체는 지금까지 코드에 상수로 박혀 있던 것과 같다. 밖으로 뺀 이유는 부하 측정에서
# 이 셋이 대조 실험의 변수이기 때문이다 — 값 하나만 바꿔 재려면 재빌드 없이 바꿀 수 있어야 한다.
upbid:
  sse:
    heartbeat-interval-ms: ${SSE_HEARTBEAT_MS:30000}
    emitter-timeout-ms: ${SSE_TIMEOUT_MS:3600000}
  auction:
    max-in-progress-per-room: ${MAX_IN_PROGRESS_PER_ROOM:3}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  onboarding-session-timeout: ${ONBOARDING_SESSION_TIMEOUT:10m}
  alert:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      cooldown-seconds: ${SLACK_ALERT_COOLDOWN_SECONDS:60}

ncp:
  sms:
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
    service-id: ${NCP_SERVICE_ID}
    send-from: ${NCP_SENDER_PHONE}
    connect-timeout: 5s
    read-timeout: 10s

# 이미지 업로드용 S3.
#
# 액세스 키·시크릿은 여기에도 환경변수에도 두지 않는다. app EC2에 붙인 인스턴스 역할
# upbid-ec2-role을 DefaultCredentialsProvider가 찾아 쓴다. 로컬은 aws configure로
# 만든 ~/.aws/credentials를 같은 provider가 찾는다. 그래서 설정이 환경마다 갈리지 않는다.
#
# public-base-url을 bucket·region에서 조립하지 않고 따로 적는다. 나중에 CloudFront를
# 앞에 두면 읽는 주소만 그 도메인으로 바뀌고 버킷 이름은 그대로이기 때문이다.
aws:
  region: ap-northeast-2
  s3:
    bucket: upbid-bucket
    public-base-url: https://upbid-bucket.s3.ap-northeast-2.amazonaws.com

