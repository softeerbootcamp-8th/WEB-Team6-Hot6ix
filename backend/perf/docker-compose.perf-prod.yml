# 측정 서버(별도 EC2)에 띄우는 구성이다 (이슈 #266).
#
# docker-compose.perf.yml 에서 app 과 mysql, nginx 를 뺀 것이다. 그 셋은 배포 스택에 이미
# 있고, 부하 발생기와 관측 도구를 재는 대상과 같은 박스에 두면 CPU 를 나눠 쓰게 되어
# 나온 숫자가 서버 한계가 아니라 둘이 싸운 결과가 된다.
#
#   docker compose -f docker-compose.perf-prod.yml up -d prometheus grafana
#
# Grafana 대시보드와 k6 스크립트는 로컬과 같은 파일을 쓴다. 도구를 새로 만들면 그 순간
# 로컬 계단과의 비교가 끊긴다.

# 로컬 구성(upbid-perf)과 프로젝트를 갈라 둔다. 같은 이름이면 compose 가 상대 파일의
# 서비스를 orphan 으로 보고 경고하고, run.sh 의 일회성 컨테이너 정리도 서로를 건드린다.
name: upbid-perf-prod

services:
  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      # 127.0.0.1 에 묶는다. 보안 그룹을 잘못 열어도 인터넷에서 안 닿는다.
      # remote-write receiver 가 켜져 있어서 열리면 아무나 가짜 시계열을 써넣을 수 있고,
      # 그러면 그 실행은 통째로 못 쓴다. 볼 때는 SSH 터널로 본다.
      - "127.0.0.1:${PERF_PROM_PORT:-19090}:9090"
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      # 앱 사설 IP 는 커밋하지 않는다. targets.yml.example 을 복사해 만든다.
      - ./targets.yml:/etc/prometheus/targets.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      # 여기도 127.0.0.1 이다. 익명 로그인을 Admin 으로 켜 둔 채라 열리면 누구나 들어와
      # 대시보드를 고칠 수 있다. 로컬에서는 도커 네트워크 안이라 괜찮던 설정이다.
      #
      #   ssh -L 13000:localhost:13000 upbid-perf
      - "127.0.0.1:${PERF_GRAFANA_PORT:-13000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:1.3.0
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),max,avg
      # 로컬은 같은 도커 네트워크의 nginx 를 때리지만 여기서는 공개 도메인이다.
      # 사설 IP 로 때리면 프록시와 TLS 를 건너뛰어서, 사용자가 겪는 경로를 재는 게 아니게 된다.
      - BASE_URL=${BASE_URL:-https://api.upbid.store/api/v1}

volumes:
  prometheus-data:
