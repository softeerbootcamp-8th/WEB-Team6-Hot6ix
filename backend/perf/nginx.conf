# 부하 측정용 리버스 프록시. k6 는 항상 여기(8080)만 때린다.
#
# 1대일 때도 앞에 두는 이유는 3주차 목요일에 --scale app=2 로 늘릴 때 부하 스크립트를
# 그대로 두기 위해서다. (2대로 늘린 뒤에는 `docker compose restart nginx` 를 한 번 한다.
# nginx 가 upstream 이름을 기동할 때 풀어서 그 결과를 들고 있기 때문이다.)
#
# conf.d 조각이 아니라 nginx.conf 전체를 갈아 끼운다. worker_connections 를 올려야 하는데
# 그건 events 블록이라 conf.d 안에서는 못 쓴다.

worker_processes auto;

events {
    # SSE 800개면 클라이언트 쪽 800 + upstream 쪽 800 이라 기본값 1024 로는 모자란다.
    # 여기서 먼저 막히면 서버 한계로 착각한다.
    worker_connections 16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 초당 수천 줄을 디스크에 쓰면 재는 대상에 로그 I/O 가 섞인다.
    # 요청이 왜 실패하는지 봐야 할 때만 잠깐 켠다.
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nodelay on;

    upstream upbid_app {
        server app:8080;

        # 이게 없으면 nginx 가 요청마다 app 으로 TCP 를 새로 연다. 초당 수천 건이면
        # 포트가 말라서 요청이 통째로 실패하는데, 그게 앱 한계처럼 보인다.
        # (실측: keepalive 없이 5 VU 로 40초 돌렸더니 요청의 71%가 응답 없이 끊겼다.)
        keepalive 128;
        keepalive_requests 100000;
        keepalive_timeout 300s;
    }

    server {
        listen 80;

        # SSE 는 끝나지 않는 스트림이라 기본값 60초 idle timeout 에 걸려 끊긴다.
        # heartbeat 주기를 바꾸는 대조 실험에서 이 값이 60초면 서버가 아니라 nginx 가 끊은
        # 것을 보고 "SSE 가 몇백 개에서 죽는다"고 잘못 읽게 된다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # upstream keepalive 는 이 둘이 함께 있어야 동작한다.
        # Connection 헤더를 비우지 않으면 nginx 가 매번 close 를 보낸다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # app 이 forward-headers-strategy: framework 로 이 헤더들을 읽는다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://upbid_app;
        }
    }
}
