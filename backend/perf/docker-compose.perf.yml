# 부하 측정 전용이다. (이슈 #242)
#
# 로컬 개발용 MySQL(backend/docker-compose.yml)과 운영 배포용(backend/deploy/docker-compose.yml)은
# 건드리지 않는다. 프로젝트 이름이 upbid-perf 라 컨테이너도 네트워크도 따로 논다.
#
# 직접 부르지 말고 ./perf/run.sh 를 쓴다. 손으로 올리면 워밍업이나 시딩을 빠뜨리게 되고,
# 그 한 번 때문에 개선 전후 비교가 깨진다.
#
# ── 왜 1대인데 nginx를 앞에 두는가 ──────────────────────────────
# 나중에 서버를 2대로 늘릴 때(3주차 목요일) 바뀌는 게 --scale app=2 한 줄뿐이게 하려고.
# k6 는 항상 nginx(8080)만 때리므로 부하 스크립트를 고칠 일이 없다.
# ────────────────────────────────────────────────────────────

name: upbid-perf

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      # k6 와 브라우저가 보는 유일한 입구.
      #
      # 개발 백엔드(8080)와 다른 포트를 쓴다. 같은 포트면 측정을 시작하는 순간 개발
      # 환경이 죽고, 프론트가 조용히 측정용 앱에 붙어서 "데이터가 다 사라졌다"가 된다.
      - "${PERF_HTTP_PORT:-18080}:80"
    volumes:
      # conf.d 조각이 아니라 nginx.conf 전체다. worker_connections 를 올려야 하는데
      # 그건 events 블록이라 conf.d 안에서는 못 쓴다.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  app:
    # Dockerfile 은 미리 만들어 둔 app.jar 를 복사만 한다(CI 와 같은 방식).
    # run.sh 가 ./gradlew bootJar 로 만들어 두고 이 build 를 부른다.
    build:
      context: ..
      dockerfile: Dockerfile
    image: upbid-app:perf
    # 호스트에 포트를 열지 않는다. 열어 두면 --scale app=2 때 포트가 충돌한다.
    expose:
      - "8080"
    # 배포 스펙과 같은 값. 노트북이 얼마나 바쁜지에 따라 결과가 흔들리면 안 된다.
    # 가장 사양 낮은 노트북 기준으로 토요일 오전에 확정하고, 바꾸면 전원이 같이 바꾼다.
    cpus: 2.0
    mem_limit: 700m
    environment:
      # 베이스 이미지 기본값이 UTC 라 이게 없으면 LocalDateTime 이 UTC 벽시계로 만들어진다.
      # 마감 시각이 9시간 어긋나서 물품이 시작하자마자 닫힌다.
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=perf
      # 모든 지표에 붙는 라벨. 실행마다 시계열을 갈라 놓는 값이라 반드시 달라야 한다.
      - PERF_RUN_ID=${PERF_RUN_ID:-unknown}
      # JDBC_EXTRA 는 run.sh 의 --prep-stmt 가 채운다. 드라이버 옵션을 바꾸는 대조 실험은
      # 앱 코드가 그대로라 jar 를 다시 안 만들어도 된다(--skip-build 로 돌릴 수 있다).
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/upbid?characterEncoding=UTF-8${JDBC_EXTRA:-}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      # 대조 실험에서 바꾸는 값들. run.sh 가 --pool, --heartbeat 같은 인자로 채운다.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - SCHEDULER_POOL_SIZE=${SCHEDULER_POOL_SIZE:-4}
      - SSE_HEARTBEAT_MS=${SSE_HEARTBEAT_MS:-30000}
      - SSE_TIMEOUT_MS=${SSE_TIMEOUT_MS:-3600000}
      - MAX_IN_PROGRESS_PER_ROOM=${MAX_IN_PROGRESS_PER_ROOM:-50}
      # 전역 스위치다. 스케줄러뿐 아니라 톰캣도 함께 가상 스레드로 바뀐다.
      - VIRTUAL_THREADS=${VIRTUAL_THREADS:-false}
      # 프론트를 안 띄우므로 CORS 는 의미가 없지만 값이 없으면 부팅이 안 된다.
      - FRONTEND_URL=http://localhost:5173
      - JAVA_TOOL_OPTIONS=${APP_JAVA_OPTS:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4.9
    # 볼륨을 일부러 안 붙인다.
    #
    # run.sh 는 실행마다 DB 를 초기화해야 하는데, named volume 을 붙이면 그러려고
    # `docker compose down -v` 를 써야 한다. 그건 팀 금지 명령이고 훅이 막는다.
    # 볼륨이 없으면 `down` 만으로 데이터가 사라져서 그럴 일이 없다.
    cpus: 2.0
    environment:
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=upbid
    expose:
      - "3306"
    command:
      # 부하 중에 어떤 행 락이 누구를 기다리는지 보려면 이 두 테이블이 켜져 있어야 한다.
      # performance_schema 는 8.x 기본 on 이지만, 노트북마다 my.cnf 가 다를 수 있어 못 박는다.
      - --performance-schema=ON
      - --performance-schema-instrument=wait/lock/metadata/sql/mdl=ON
      # RR 은 범위 조회에 갭 락을 걸고 RC 는 안 건다. 입찰이 물품 행 하나만 잠그는지 그 옆
      # 빈 구간까지 잠그는지가 갈려서, 경합이 행 락 때문인지 갭 때문인지를 가를 수 있다.
      # run.sh --isolation RC 로 바꾼다. 기본값은 MySQL 기본과 같은 RR 이다.
      - --transaction-isolation=${TX_ISOLATION:-REPEATABLE-READ}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      - "${PERF_PROM_PORT:-19090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 이건 볼륨을 붙인다. 없으면 컨테이너를 내릴 때 측정치가 통째로 날아가고,
      # run.sh 가 결과를 뽑기 전에 내려 버리면 그 실행은 복구할 수 없다.
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # k6 가 자기 지표(VU 수, 부하 발생기 CPU)를 여기로 밀어 넣는다.
      # 서버 처리량과 k6 CPU 를 한 그래프에서 봐야 "여기부터는 부하 발생기가 병목"을 판정할 수 있다.
      - --web.enable-remote-write-receiver

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      # 3000 은 Next.js 등 다른 개발 서버가 자주 쓴다. perf 대역으로 옮긴다.
      - "${PERF_GRAFANA_PORT:-13000}:3000"
    environment:
      # 로그인을 없앤다. 다섯 명이 각자 admin 비밀번호를 바꾸는 데 시간을 쓸 이유가 없다.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # 대시보드는 한 명이 만들어 커밋한다. 각자 만들면 서로 다른 화면을 보고 이야기하게 된다.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # k6 는 컨테이너로 고정한다. 각자 brew 로 깔면 버전이 갈리고, 버전에 따라 출력 플래그가
  # experimental-prometheus-rw / prometheus-rw 로 나뉘어서 누구는 k6 지표가 안 들어온다.
  #
  # 평소엔 안 뜬다(profiles). run.sh 가 `run --rm k6` 로 그때만 부른다.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      # k6 자체 지표도 히스토그램으로 밀어 넣어야 p95 를 Grafana 에서 뽑는다.
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),max,avg
      - BASE_URL=http://nginx/api/v1

volumes:
  prometheus-data:
