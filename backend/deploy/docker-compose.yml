# 운영 배포용이다. (로컬 개발용 MySQL은 backend/docker-compose.yml)
#
# 이 파일은 CD가 배포할 때마다 EC2의 /home/ubuntu/app으로 복사해 덮어쓴다.
# 서버에서 직접 고치면 다음 배포에 사라지므로, 수정은 이 파일에서 한다.
#
# ${} 참조 값은 모두 같은 디렉터리의 .env에서 온다.
# .env도 CD가 배포할 때마다 생성한다 (IMAGE_TAG는 커밋 sha, 나머지는 GitHub Secrets).

services:
  app:
    image: ${DOCKERHUB_USERNAME}/upbid-app:${IMAGE_TAG}
    ports:
      - "8080:8080"
    mem_limit: 700m
    # /actuator/health가 DOWN인 채로 계속 떠 있어도 감지할 방법이 없었다 (#299).
    # unhealthy가 된다고 docker가 자동으로 재시작해주지는 않지만, 최소한 `docker ps`와
    # 모니터링에서 상태가 보이게 한다.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      # 베이스 이미지 기본값이 UTC라 LocalDateTime이 UTC 벽시계로 만들어진다.
      # 응답에는 오프셋이 없어서(예: "2026-08-04T07:55:00") 브라우저가 KST로 읽고,
      # 마감 시각이 9시간 과거가 되어 카운트다운이 0에서 멈춘다.
      # 응답에 오프셋을 담는 근본 해결은 공용 계약 변경이라 #156에서 따로 다룬다.
      - TZ=Asia/Seoul
      # DB_JDBC_EXTRA 는 드라이버 옵션 대조 실험용이다. `?cachePrepStmts=true` 처럼 ? 로 시작하는
      # 문자열을 넣으면 주소 뒤에 그대로 붙는다. 재배포가 곧 측정 중단이라 재빌드 없이 바꿔야 한다.
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:3306/upbid${DB_JDBC_EXTRA:-}
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      # Redis (ElastiCache 등 외부 관리형). 연결만 깔아둔 상태였다가(#277) 지금은 실제로 쓴다.
      #
      #   - 분산 락 (ShedLock, #286)
      #   - 물품 마감 예약 (#289)
      #
      # **REDIS_ENDPOINT 가 비면 마감이 멈춘다.** 예약이 Redis 에만 있어서, 빈 호스트로는
      # 붙지 못해 마감 시각이 지난 물품이 계속 진행중으로 남는다. 앱은 그래도 뜨고 다른 API 는
      # 멀쩡해서 조용히 그렇게 된다. DB 가 원본이라 데이터가 깨지지는 않고, Redis 가 돌아오면
      # 재동기화가 예약을 다시 채운다.
      #
      # 배포 전에 값이 들어갔는지 확인한다: gh secret list | grep REDIS
      - REDIS_HOST=${REDIS_ENDPOINT:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_SSL_ENABLED=${REDIS_SSL_ENABLED:-true}
      # 아래는 전부 부하 측정용 손잡이다 (이슈 #266). 값을 안 주면 지금과 동작이 같다.
      #
      # ACTUATOR_EXPOSURE 를 열기 전에 nginx 에서 /actuator 를 측정 서버 IP 로 제한한다.
      # 8080 이 호스트에 그대로 뚫려 있어서 프록시를 안 거치는 경로가 남는다.
      - ACTUATOR_EXPOSURE=${ACTUATOR_EXPOSURE:-health}
      # 비워 두면 dev-login 엔드포인트 자체가 안 생긴다. 측정 창구에만 값을 주고 끝나면 지운다.
      - DEV_LOGIN_TOKEN=${DEV_LOGIN_TOKEN:-}
      - PERF_RUN_ID=${PERF_RUN_ID:-unknown}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - SCHEDULER_POOL_SIZE=${SCHEDULER_POOL_SIZE:-4}
      # Redis Stream → MySQL 단건 Consumer. 배포 부하에서 pending·lag·persist 시간을 보고 조정한다.
      - BID_STREAM_POLL_DELAY=${BID_STREAM_POLL_DELAY:-100ms}
      - BID_STREAM_BLOCK_TIMEOUT=${BID_STREAM_BLOCK_TIMEOUT:-50ms}
      - BID_STREAM_LOCK_AT_MOST_FOR=${BID_STREAM_LOCK_AT_MOST_FOR:-5s}
      # 마감 예약을 Redis 에서 꺼내 실행하는 값들 (#289). 기본값은 application.yaml 과 같다.
      #
      # 여기와 CICD-BE.yml 의 .env 생성 블록 양쪽에 다 있어야 실제로 먹는다. compose 에만
      # 넣으면 .env 에 키가 없어 언제나 기본값이고, .env 에만 넣으면 컨테이너로 전달이 안 된다.
      - CLOSE_POLL_INTERVAL_MS=${CLOSE_POLL_INTERVAL_MS:-100}
      - CLOSE_CLAIM_BATCH_SIZE=${CLOSE_CLAIM_BATCH_SIZE:-50}
      - CLOSE_VISIBILITY_TIMEOUT=${CLOSE_VISIBILITY_TIMEOUT:-30s}
      - CLOSE_WORKER_POOL_SIZE=${CLOSE_WORKER_POOL_SIZE:-4}
      - CLOSE_QUEUE_CAPACITY=${CLOSE_QUEUE_CAPACITY:-50}
      - CLOSE_RESYNC_INTERVAL_MS=${CLOSE_RESYNC_INTERVAL_MS:-60000}
      # 마감 임박 알림 예약을 꺼내 실행하는 값들 (#290). 마감과 따로 두는 것은 알림 한 건이
      # 훨씬 가벼워서 같은 값으로 맞출 이유가 없고, 한쪽만 조여 볼 수 있게 하려는 것이다.
      - CLOSING_SOON_POLL_INTERVAL_MS=${CLOSING_SOON_POLL_INTERVAL_MS:-500}
      - CLOSING_SOON_CLAIM_BATCH_SIZE=${CLOSING_SOON_CLAIM_BATCH_SIZE:-50}
      - CLOSING_SOON_VISIBILITY_TIMEOUT=${CLOSING_SOON_VISIBILITY_TIMEOUT:-10s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-info}
      - SSE_HEARTBEAT_MS=${SSE_HEARTBEAT_MS:-30000}
      - SSE_TIMEOUT_MS=${SSE_TIMEOUT_MS:-3600000}
      - MAX_IN_PROGRESS_PER_ROOM=${MAX_IN_PROGRESS_PER_ROOM:-3}
      # 카카오 로그인 (application.yaml 의 oauth.kakao.*)
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      # NCP SENS 문자 발송 (application.yaml 의 ncp.sms.*)
      - NCP_ACCESS_KEY=${NCP_ACCESS_KEY}
      - NCP_SECRET_KEY=${NCP_SECRET_KEY}
      - NCP_SERVICE_ID=${NCP_SERVICE_ID}
      - NCP_SENDER_PHONE=${NCP_SENDER_PHONE}
      # 로그인 후 돌아갈 프론트 주소 (application.yaml 의 app.frontend-url)
      - FRONTEND_URL=${FRONTEND_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    restart: unless-stopped
