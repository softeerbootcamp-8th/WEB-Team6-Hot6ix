# 운영 배포용이다. (로컬 개발용 MySQL은 backend/docker-compose.yml)
#
# 이 파일은 CD가 배포할 때마다 EC2의 /home/ubuntu/app으로 복사해 덮어쓴다.
# 서버에서 직접 고치면 다음 배포에 사라지므로, 수정은 이 파일에서 한다.
#
# ${} 참조 값은 모두 같은 디렉터리의 .env에서 온다.
# .env도 CD가 배포할 때마다 생성한다 (IMAGE_TAG는 커밋 sha, 나머지는 GitHub Secrets).

services:
  app:
    image: ${DOCKERHUB_USERNAME}/upbid-app:${IMAGE_TAG}
    ports:
      - "8080:8080"
    mem_limit: 700m

    # 부하 측정용 손잡이만 따로 받는 파일이다 (이슈 #266).
    #
    # .env는 CD가 배포할 때마다 `cat >`로 새로 써서 손으로 넣은 줄이 사라진다. 이 파일은
    # CD가 안 건드리므로 **한 번 만들어 두면 배포해도 남는다.** 측정이 끝나면 파일을 지운다.
    #
    #   cat > .env.perf <<EOF
    #   ACTUATOR_EXPOSURE=health,metrics,prometheus
    #   DEV_LOGIN_TOKEN=<열쇠값>
    #   EOF
    #   docker compose up -d
    #
    # 없어도 정상이다(required: false). 그때는 앱이 application.yaml의 기본값으로 뜨고
    # 지금과 동작이 같다 — actuator는 health만, dev-login은 빈 자체가 안 생긴다.
    #
    # **여기 있는 키를 아래 environment에 또 적으면 안 된다.** environment가 env_file을
    # 덮어써서 이 파일이 통째로 무시된다.
    #
    # required: false 는 Docker Compose 2.24 이상이 필요하다. 서버가 그보다 낮으면
    # `docker compose config` 가 여기서 실패하므로, 그때는 빈 .env.perf 를 만들어 두고
    # 짧은 문법(`- .env.perf`)으로 바꾼다.  확인: docker compose version
    env_file:
      - path: .env.perf
        required: false

    environment:
      # 베이스 이미지 기본값이 UTC라 LocalDateTime이 UTC 벽시계로 만들어진다.
      # 응답에는 오프셋이 없어서(예: "2026-08-04T07:55:00") 브라우저가 KST로 읽고,
      # 마감 시각이 9시간 과거가 되어 카운트다운이 0에서 멈춘다.
      # 응답에 오프셋을 담는 근본 해결은 공용 계약 변경이라 #156에서 따로 다룬다.
      - TZ=Asia/Seoul
      # DB_JDBC_EXTRA 는 드라이버 옵션 대조 실험용이다. `?cachePrepStmts=true` 처럼 ? 로 시작하는
      # 문자열을 넣으면 주소 뒤에 그대로 붙는다. 재배포가 곧 측정 중단이라 재빌드 없이 바꿔야 한다.
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:3306/upbid${DB_JDBC_EXTRA:-}
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      #
      # 측정용 손잡이는 여기 안 적는다. 위 env_file(.env.perf)로 받는다.
      # environment가 env_file보다 우선이라, 여기 적으면 .env.perf가 무시된다.
      #
      # 안 줬을 때의 기본값은 application.yaml과 application-prod.yaml이 이미 갖고 있다.
      #   ACTUATOR_EXPOSURE=health   DEV_LOGIN_TOKEN=(빈 값)   PERF_RUN_ID=unknown
      #   DB_POOL_SIZE=10   SCHEDULER_POOL_SIZE=4   LOG_LEVEL=info
      #   SSE_HEARTBEAT_MS=30000   SSE_TIMEOUT_MS=3600000   MAX_IN_PROGRESS_PER_ROOM=3
      #
      # 카카오 로그인 (application.yaml 의 oauth.kakao.*)
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      # NCP SENS 문자 발송 (application.yaml 의 ncp.sms.*)
      - NCP_ACCESS_KEY=${NCP_ACCESS_KEY}
      - NCP_SECRET_KEY=${NCP_SECRET_KEY}
      - NCP_SERVICE_ID=${NCP_SERVICE_ID}
      - NCP_SENDER_PHONE=${NCP_SENDER_PHONE}
      # 로그인 후 돌아갈 프론트 주소 (application.yaml 의 app.frontend-url)
      - FRONTEND_URL=${FRONTEND_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    restart: unless-stopped
