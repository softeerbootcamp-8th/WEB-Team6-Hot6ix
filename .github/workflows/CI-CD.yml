name: CI/CD - Backend

on:
  push:
    branches:
      - main
      - dev
      - 'be/**'
      - 'Infra/**'
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x ./gradlew && ./gradlew build -x test
        working-directory: ./backend

  build-and-push:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/upbid-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: NAT를 경유해 private EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_PRIVATE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.NAT_HOST }}
          proxy_username: ${{ secrets.NAT_USERNAME }}
          proxy_key: ${{ secrets.NAT_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            export IMAGE_TAG=${{ github.sha }}
            cd /home/ubuntu/app
            docker compose pull app
            docker compose up -d
            docker image prune -f