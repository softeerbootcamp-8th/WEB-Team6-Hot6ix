name: CICD - Backend

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  # 커밋 없이 재배포할 때 쓴다 (EC2 재시작 후, 배포 재시도 등).
  # Actions 탭의 버튼은 기본 브랜치의 워크플로 파일을 기준으로 노출된다.
  workflow_dispatch:

jobs:
  # CI: main, dev로 향하는 PR에서 빌드 및 테스트
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon build

  # CD: main push 또는 수동 실행 시 jar 빌드(테스트는 PR 단계에서 이미 검증됨) 후,
  # 같은 job 안에서 바로 이미지로 만들어 push.
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon bootJar
      - name: 빌드 산출물을 app.jar로 고정해 docker build context 루트로 이동
        run: mv build/libs/*.jar app.jar
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/upbid-app:${{ github.sha }}

  # CD 3단계: NAT를 경유해 private EC2에 배포.
  # compose 파일과 .env는 서버에 두지 않고 배포할 때마다 새로 만들어 올린다.
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # scp-action이 러너 디스크에서 파일을 읽으므로 checkout이 필요하다
      - uses: actions/checkout@v4

      - name: 배포용 compose 파일 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_PRIVATE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.NAT_HOST }}
          proxy_username: ${{ secrets.NAT_USERNAME }}
          proxy_key: ${{ secrets.NAT_SSH_KEY }}
          source: backend/deploy/docker-compose.yml
          target: /home/ubuntu/app
          # backend/deploy/ 두 단계를 잘라내 /home/ubuntu/app 바로 아래 놓는다.
          # 경로가 어긋나면 compose 프로젝트 이름이 바뀌어 기존 컨테이너를 교체하지 못한다.
          strip_components: 2

      - name: .env 생성 후 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_PRIVATE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.NAT_HOST }}
          proxy_username: ${{ secrets.NAT_USERNAME }}
          proxy_key: ${{ secrets.NAT_SSH_KEY }}
          # 값이 깨지는 곳이 두 군데다. 둘 다 막아야 한다.
          #   1) 원격 셸 — heredoc을 <<'EOF'로 닫아 $와 백틱을 그대로 넘긴다.
          #   2) docker compose — .env를 읽을 때 $VAR를 제 손으로 치환한다.
          #      값을 작은따옴표로 감싸야 $·백틱·#가 살아남는다.
          #      (따옴표를 빼면 `se$cret`이 `se`로 잘려 조용히 인증이 실패한다.)
          # 값 자체에 작은따옴표가 들어가면 이 방식이 깨지므로 그런 키는 쓰지 않는다.
          #
          # SLACK_WEBHOOK_URL 아래는 부하 측정용 손잡이다 (이슈 #266). 여기에 적어 두는 이유는
          # 이 단계가 .env를 append가 아니라 `cat >`로 새로 쓰기 때문이다. 서버에서 손으로 넣으면
          # 다음 배포에 지워지고, 그러면 재는 도중에 조건이 조용히 바뀐다.
          #
          # Repository variables라 값을 안 만들면 빈 문자열이 들어간다. compose가 전부
          # ${VAR:-기본값} 꼴이고 :-는 빈 값도 기본값으로 받으므로, 변수를 하나도 안 만든 지금은
          # 동작이 그대로다. 창구에서는 Actions 화면에서 변수만 바꾸고 재배포하면 된다.
          #
          # DEV_LOGIN_TOKEN만 secrets에 둔다. 이 값을 아는 요청은 아무 회원으로나 로그인할 수
          # 있는데, variables는 읽기 권한이 있으면 다 보이고 로그에도 그대로 찍힌다.
          script: |
            set -e
            cd /home/ubuntu/app
            umask 077
            cat > .env <<'EOF'
            IMAGE_TAG='${{ github.sha }}'
            DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            RDS_ENDPOINT='${{ secrets.RDS_ENDPOINT }}'
            RDS_USERNAME='${{ secrets.RDS_USERNAME }}'
            RDS_PASSWORD='${{ secrets.RDS_PASSWORD }}'
            KAKAO_CLIENT_ID='${{ secrets.KAKAO_CLIENT_ID }}'
            KAKAO_CLIENT_SECRET='${{ secrets.KAKAO_CLIENT_SECRET }}'
            KAKAO_REDIRECT_URI='${{ secrets.KAKAO_REDIRECT_URI }}'
            NCP_ACCESS_KEY='${{ secrets.NCP_ACCESS_KEY }}'
            NCP_SECRET_KEY='${{ secrets.NCP_SECRET_KEY }}'
            NCP_SERVICE_ID='${{ secrets.NCP_SERVICE_ID }}'
            NCP_SENDER_PHONE='${{ secrets.NCP_SENDER_PHONE }}'
            FRONTEND_URL='${{ secrets.FRONTEND_URL }}'
            SLACK_WEBHOOK_URL='${{ secrets.SLACK_WEBHOOK_URL }}'
            ACTUATOR_EXPOSURE='${{ vars.ACTUATOR_EXPOSURE }}'
            PERF_RUN_ID='${{ vars.PERF_RUN_ID }}'
            DB_POOL_SIZE='${{ vars.DB_POOL_SIZE }}'
            DB_JDBC_EXTRA='${{ vars.DB_JDBC_EXTRA }}'
            SCHEDULER_POOL_SIZE='${{ vars.SCHEDULER_POOL_SIZE }}'
            CLOSE_POLL_INTERVAL_MS='${{ vars.CLOSE_POLL_INTERVAL_MS }}'
            CLOSE_CLAIM_BATCH_SIZE='${{ vars.CLOSE_CLAIM_BATCH_SIZE }}'
            CLOSE_VISIBILITY_TIMEOUT='${{ vars.CLOSE_VISIBILITY_TIMEOUT }}'
            CLOSE_WORKER_POOL_SIZE='${{ vars.CLOSE_WORKER_POOL_SIZE }}'
            CLOSE_QUEUE_CAPACITY='${{ vars.CLOSE_QUEUE_CAPACITY }}'
            CLOSE_RESYNC_INTERVAL_MS='${{ vars.CLOSE_RESYNC_INTERVAL_MS }}'
            CLOSING_SOON_POLL_INTERVAL_MS='${{ vars.CLOSING_SOON_POLL_INTERVAL_MS }}'
            CLOSING_SOON_CLAIM_BATCH_SIZE='${{ vars.CLOSING_SOON_CLAIM_BATCH_SIZE }}'
            CLOSING_SOON_VISIBILITY_TIMEOUT='${{ vars.CLOSING_SOON_VISIBILITY_TIMEOUT }}'
            LOG_LEVEL='${{ vars.LOG_LEVEL }}'
            APP_LOG_LEVEL='${{ vars.APP_LOG_LEVEL }}'
            SSE_HEARTBEAT_MS='${{ vars.SSE_HEARTBEAT_MS }}'
            SSE_TIMEOUT_MS='${{ vars.SSE_TIMEOUT_MS }}'
            MAX_IN_PROGRESS_PER_ROOM='${{ vars.MAX_IN_PROGRESS_PER_ROOM }}'
            DEV_LOGIN_TOKEN='${{ secrets.DEV_LOGIN_TOKEN }}'
            REDIS_ENDPOINT='${{ secrets.REDIS_ENDPOINT }}'
            REDIS_PORT='${{ vars.REDIS_PORT }}'
            REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}'
            REDIS_SSL_ENABLED='${{ vars.REDIS_SSL_ENABLED }}'
            RATE_LIMIT_REDIS_TIMEOUT='${{ vars.RATE_LIMIT_REDIS_TIMEOUT }}'
            BID_RATE_LIMIT_ENABLED='${{ vars.BID_RATE_LIMIT_ENABLED }}'
            BID_RATE_LIMIT_CAPACITY='${{ vars.BID_RATE_LIMIT_CAPACITY }}'
            BID_RATE_LIMIT_REFILL_PER_SECOND='${{ vars.BID_RATE_LIMIT_REFILL_PER_SECOND }}'
            EOF
            docker compose pull app
            docker compose up -d
            docker image prune -f
