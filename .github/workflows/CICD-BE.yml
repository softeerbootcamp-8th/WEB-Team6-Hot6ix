name: CICD - Backend

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  # CI: main, dev로 향하는 PR에서 빌드 및 테스트
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon build

  # CD: main push 시 jar 빌드(테스트는 PR 단계에서 이미 검증됨) 후, 같은 job 안에서 바로 이미지로 만들어 push.
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon bootJar
      - name: 빌드 산출물을 app.jar로 고정해 docker build context 루트로 이동
        run: mv build/libs/*.jar app.jar
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/upbid-app:${{ github.sha }}

  # CD 3단계: NAT를 경유해 private EC2에 배포.
  # compose 파일과 .env는 서버에 두지 않고 배포할 때마다 새로 만들어 올린다.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # scp-action이 러너 디스크에서 파일을 읽으므로 checkout이 필요하다
      - uses: actions/checkout@v4

      - name: 배포용 compose 파일 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_PRIVATE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.NAT_HOST }}
          proxy_username: ${{ secrets.NAT_USERNAME }}
          proxy_key: ${{ secrets.NAT_SSH_KEY }}
          source: backend/deploy/docker-compose.yml
          target: /home/ubuntu/app
          # backend/deploy/ 두 단계를 잘라내 /home/ubuntu/app 바로 아래 놓는다.
          # 경로가 어긋나면 compose 프로젝트 이름이 바뀌어 기존 컨테이너를 교체하지 못한다.
          strip_components: 2

      - name: .env 생성 후 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_PRIVATE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.NAT_HOST }}
          proxy_username: ${{ secrets.NAT_USERNAME }}
          proxy_key: ${{ secrets.NAT_SSH_KEY }}
          # heredoc의 따옴표(<<'EOF')를 빼면 비밀번호 안의 $나 백틱을
          # 원격 셸이 변수로 해석해 값이 깨진다.
          script: |
            set -e
            cd /home/ubuntu/app
            umask 077
            cat > .env <<'EOF'
            IMAGE_TAG=${{ github.sha }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            RDS_ENDPOINT=${{ secrets.RDS_ENDPOINT }}
            RDS_USERNAME=${{ secrets.RDS_USERNAME }}
            RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}
            EOF
            docker compose pull app
            docker compose up -d
            docker image prune -f
